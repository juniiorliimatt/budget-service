openapi: 3.1.0
info:
  contact:
    email: oojuniin@outlook.com
    name: Junior Lima
  description: "Contrato REST do budget-service. Este documento é a fonte da verdade\
    \ para qualquer client (frontend, agentes de IA) que consuma esta API — não assuma\
    \ comportamento não descrito aqui."
  title: Budget Service API
  version: 0.0.1
servers:
- description: Relativo ao host onde a API estiver publicada
  url: /
security:
- bearer-jwt: []
paths:
  /api/revenues:
    get:
      operationId: findAll
      parameters:
      - in: query
        name: pageable
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageRevenueDTO"
          description: OK
      tags:
      - revenue-controller
    post:
      operationId: save
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevenueInsertOrUpdateDTO"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RevenueDTO"
          description: Created
      tags:
      - revenue-controller
  /api/revenues/{id}:
    delete:
      operationId: delete
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
      tags:
      - revenue-controller
    get:
      operationId: findById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RevenueDTO"
          description: OK
      tags:
      - revenue-controller
    put:
      operationId: update
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevenueInsertOrUpdateDTO"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RevenueDTO"
          description: OK
      tags:
      - revenue-controller
components:
  schemas:
    PageRevenueDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/RevenueDTO"
        empty:
          type: boolean
        first:
          type: boolean
        last:
          type: boolean
        number:
          type: integer
          format: int32
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        size:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        paged:
          type: boolean
        sort:
          $ref: "#/components/schemas/SortObject"
        unpaged:
          type: boolean
    RevenueDTO:
      type: object
      properties:
        date:
          type: string
          format: date
        id:
          type: string
          format: uuid
        name:
          type: string
        value:
          type: number
    RevenueInsertOrUpdateDTO:
      type: object
      properties:
        date:
          type: string
          format: date
        name:
          type: string
          minLength: 1
        value:
          type: number
      required:
      - date
      - name
      - value
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
  securitySchemes:
    bearer-jwt:
      bearerFormat: JWT
      name: bearer-jwt
      scheme: bearer
      type: http
