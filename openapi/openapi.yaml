components:
  schemas:
    BudgetBucketDTO:
      type: object
      properties:
        actual:
          type: number
        difference:
          type: number
        target:
          type: number
    FiftyThirtyTwentyDTO:
      type: object
      properties:
        essential:
          $ref: "#/components/schemas/BudgetBucketDTO"
        personal:
          $ref: "#/components/schemas/BudgetBucketDTO"
        savings:
          $ref: "#/components/schemas/BudgetBucketDTO"
        totalRevenue:
          type: number
    MonthlySummaryDTO:
      type: object
      properties:
        projectedBalance:
          type: number
        totalPaid:
          type: number
        totalPending:
          type: number
        totalRevenue:
          type: number
        totalSpending:
          type: number
    PageRevenueDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/RevenueDTO"
        empty:
          type: boolean
        first:
          type: boolean
        last:
          type: boolean
        number:
          type: integer
          format: int32
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        size:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PageSpendingDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/SpendingDTO"
        empty:
          type: boolean
        first:
          type: boolean
        last:
          type: boolean
        number:
          type: integer
          format: int32
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        size:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        paged:
          type: boolean
        sort:
          $ref: "#/components/schemas/SortObject"
        unpaged:
          type: boolean
    RevenueAnnualBatchRequestDTO:
      type: object
      properties:
        months:
          type: array
          items:
            type: integer
            format: int32
            maximum: 12
            minimum: 1
          uniqueItems: true
        revenues:
          type: array
          items:
            $ref: "#/components/schemas/RevenueDTO"
          maxItems: 500
          minItems: 0
      required:
      - revenues
    RevenueBatchRequestDTO:
      type: object
      properties:
        revenues:
          type: array
          items:
            $ref: "#/components/schemas/RevenueDTO"
          maxItems: 500
          minItems: 0
      required:
      - revenues
    RevenueDTO:
      type: object
      properties:
        date:
          type: string
          format: date
        id:
          type: string
          format: uuid
        referenceDate:
          type: string
          format: date
        typeId:
          type: string
          format: uuid
        typeName:
          type: string
        value:
          type: number
      required:
      - date
      - typeId
      - value
    RevenueRevisionDTO:
      type: object
      properties:
        changedAt:
          type: string
          format: date-time
        changedBy:
          type: string
        date:
          type: string
          format: date
        id:
          type: string
          format: uuid
        referenceDate:
          type: string
          format: date
        revision:
          type: integer
          format: int32
        revisionType:
          type: string
        typeId:
          type: string
          format: uuid
        value:
          type: number
    RevenueTypeDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        includeInMonthlyTotals:
          type: boolean
        includeInTotals:
          type: boolean
        name:
          type: string
          minLength: 1
      required:
      - name
    RevenueTypeRevisionDTO:
      type: object
      properties:
        changedAt:
          type: string
          format: date-time
        changedBy:
          type: string
        id:
          type: string
          format: uuid
        includeInMonthlyTotals:
          type: boolean
        includeInTotals:
          type: boolean
        name:
          type: string
        revision:
          type: integer
          format: int32
        revisionType:
          type: string
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
    SpendingAnnualBatchRequestDTO:
      type: object
      properties:
        months:
          type: array
          items:
            type: integer
            format: int32
            maximum: 12
            minimum: 1
          uniqueItems: true
        spendings:
          type: array
          items:
            $ref: "#/components/schemas/SpendingDTO"
          maxItems: 500
          minItems: 0
      required:
      - spendings
    SpendingBatchRequestDTO:
      type: object
      properties:
        spendings:
          type: array
          items:
            $ref: "#/components/schemas/SpendingDTO"
          maxItems: 500
          minItems: 0
      required:
      - spendings
    SpendingDTO:
      type: object
      properties:
        date:
          type: string
          format: date
        description:
          type: string
          maxLength: 250
          minLength: 3
        id:
          type: string
          format: uuid
        referenceDate:
          type: string
          format: date
        typeId:
          type: string
          format: uuid
        typeName:
          type: string
        value:
          type: number
        wasPaid:
          type: boolean
      required:
      - date
      - typeId
      - value
      - wasPaid
    SpendingRevisionDTO:
      type: object
      properties:
        changedAt:
          type: string
          format: date-time
        changedBy:
          type: string
        date:
          type: string
          format: date
        description:
          type: string
        id:
          type: string
          format: uuid
        referenceDate:
          type: string
          format: date
        revision:
          type: integer
          format: int32
        revisionType:
          type: string
        typeId:
          type: string
          format: uuid
        value:
          type: number
        wasPaid:
          type: boolean
    SpendingTypeDTO:
      type: object
      properties:
        category:
          type: string
          enum:
          - ESSENTIAL
          - PERSONAL
          - SAVINGS
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
      required:
      - category
      - name
    SpendingTypeRevisionDTO:
      type: object
      properties:
        category:
          type: string
          enum:
          - ESSENTIAL
          - PERSONAL
          - SAVINGS
        changedAt:
          type: string
          format: date-time
        changedBy:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
        revision:
          type: integer
          format: int32
        revisionType:
          type: string
    TotalDTO:
      type: object
      properties:
        total:
          type: number
    TypeTotalDTO:
      type: object
      properties:
        total:
          type: number
        typeId:
          type: string
          format: uuid
        typeName:
          type: string
    YearlySummaryDTO:
      type: object
      properties:
        balance:
          type: number
        totalRevenue:
          type: number
        totalSpending:
          type: number
  securitySchemes:
    bearer-jwt:
      bearerFormat: JWT
      name: bearer-jwt
      scheme: bearer
      type: http
