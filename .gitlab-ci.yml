image: eclipse-temurin:26-jdk-jammy

stages:
  - test
  - contract
  - build

test:
  stage: test
  script:
    - chmod +x gradlew
    - ./gradlew check test

contract-drift-check:
  stage: contract
  script:
    - chmod +x gradlew
    - cp openapi/openapi.yaml openapi/openapi.yaml.committed
    - ./gradlew generateOpenApiDocs
    - diff -u openapi/openapi.yaml.committed openapi/openapi.yaml || (echo "O contrato openapi/openapi.yaml está desatualizado. Rode './gradlew generateOpenApiDocs' e faça commit do resultado." && exit 1)
  artifacts:
    paths:
      - openapi/openapi.yaml
    expire_in: 1 week

build:
  stage: build
  script:
    - chmod +x gradlew
    - ./gradlew clean build
  artifacts:
    paths:
      - build/libs/budget-service-0.0.1-SNAPSHOT.jar
    expire_in: 1 week
