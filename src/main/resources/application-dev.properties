spring.main.banner-mode=console
spring.output.ansi.enabled=always

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/workbox}
spring.datasource.username=${POSTGRES_USER:budget_service}
spring.datasource.password=${POSTGRES_PASSWORD:budget_service}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.liquibase.enabled=true
spring.liquibase.drop-first=false
spring.liquibase.default-schema=${SCHEMA:budget}

spring.jpa.properties.hibernate.default_schema=${SCHEMA:budget}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.format_sql=true
spring.jpa.properties.show_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=true

debug=false
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){blue} %clr(%-5p) %clr([env:${spring.profiles.active}]){green} %clr(${PID}){faint} %clr([%thread]){cyan} %clr(%logger{36}){yellow} %clr(:){red} %clr(%m){faint}%n

server.error.include-path=always
server.error.include-message=always
server.error.include-exception=true
server.error.include-stacktrace=always
server.error.include-binding-errors=always
